  basis: 'Live-corpus experiment, 18 questions (6 topics x 3 phrasings), identical documents under each
    chunking, isolated by generation marker. Retrieval hit@5 was identical (17/18, same single miss),
    so the quality order above cannot separate the candidates; p95 latency favours fixed-300 by 0.06s,
    which is why it remains the deterministic pick. Answer rate through the real answer stage, corpus
    only, was 14/18 hierarchical vs 12/18 fixed-300 vs 11/18 semantic-300: the 4.5x larger parent chunk
    gives the model enough context to commit on synthesis questions (automatic failover, rdb vs aof) where
    fixed-300 abstained. Hierarchical retrieval measurements below mirror fixed-300 because that is what
    was measured.'
