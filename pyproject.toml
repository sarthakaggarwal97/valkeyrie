[project]
name = "valkeyrie"
version = "0.1.0"
description = "A cited, version-aware, read-only assistant for Valkey"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "BSD-3-Clause"
authors = [{ name = "Sarthak Aggarwal" }]
dependencies = [
    "aws-cdk-lib==2.265.0",
    "jsonschema==4.26.0",
    "pathspec==1.1.1",
    "PyYAML==6.0.3",
]

[dependency-groups]
# The Slack bot's own closure, locked with everything else so pip-audit sees it and so a restart
# resolves the same transitive versions as the last one (uv run --with resolved them anew).
bot = ["boto3==1.40.21", "slack-bolt==1.21.2"]
dev = [
    "bandit==1.9.4",
    "hatchling==1.32.4",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
    "types-jsonschema==4.26.0.20260518",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valkeyrie"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "infra", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.bandit]
exclude_dirs = ["tests"]
