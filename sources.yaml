api_version: valkeyrie.io/sources/1
kind: SourceInventory
inventory:
  organization: valkey-io
  observed_at: "2026-08-18T17:34:09Z"
  observation_method: read_only_github_api
  active_nonfork_repositories: 46
  curated_or_structured: 43
  live_only_or_excluded: 3

defaults:
  source_visibility: public_only
  revision_policy: resolve_to_full_commit
  unknown_repository_behavior: fail
  unknown_path_behavior: exclude
  retrieved_content_is_untrusted: true
  max_file_bytes: 1048576
  max_repository_bytes: 104857600

path_matching:
  dialect: gitignore
  deny_overrides_allow: true
  precedence:
    - hard_exclusions
    - policy_exclusions
    - policy_inclusions
    - fallback_exclude

hard_exclusions:
  - reason: repository_metadata_dependencies_build_and_generated_output_are_not_source_material
    patterns:
      - .git/**
      - "**/.git/**"
      - node_modules/**
      - "**/node_modules/**"
      - deps/**
      - "**/deps/**"
      - vendor/**
      - "**/vendor/**"
      - third_party/**
      - "**/third_party/**"
      - submodules/**
      - "**/submodules/**"
      - target/**
      - "**/target/**"
      - build/**
      - "**/build/**"
      - dist/**
      - "**/dist/**"
      - "**/generated/**"
      - "**/generated_commands/**"
      - out/**
      - "**/out/**"
      - .venv/**
      - "**/__pycache__/**"
  - reason: agent_control_templates_fixtures_prompts_and_evaluations_are_not_evidence
    patterns:
      - templates/**
      - "**/templates/**"
      - AGENTS.md
      - "**/AGENTS.md"
      - .agents/**
      - "**/.agents/**"
      - .kiro/**
      - "**/.kiro/**"
      - .test/**
      - "**/.test/**"
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE*
      - "**/.github/copilot-instructions.md"
      - prompts/**
      - evals/**
      - "**/expected-answers/**"
      - "**/grader/**"
  - reason: binary_archive_minified_and_credential_shaped_content_is_not_text_corpus
    patterns:
      - "**/*.min.js"
      - "**/*.min.css"
      - "**/*.zip"
      - "**/*.tar"
      - "**/*.gz"
      - "**/*.bz2"
      - "**/*.7z"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.pdf"
      - "**/*.so"
      - "**/*.dylib"
      - "**/*.dll"
      - "**/*.jar"
      - "**/*.jceks"
      - "**/*.pem"
      - "**/*.bat"
      - "**/*.exe"
      - "**/.env*"
      - "**/*secret*"
      - "**/*credential*"

path_policies:
  project_policy:
    rules:
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /GOVERNANCE*
          - /SECURITY*
          - /CODE_OF_CONDUCT*
          - /LICENSE*
          - "/*.md"
          - docs/**/*.md
          - policies/**/*.md
          - profile/**/*.md
        reason: reviewed_project_policy_and_guidance
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  core_source:
    rules:
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /SECURITY*
          - /LICENSE*
          - "/*.md"
          - design-docs/**/*.md
          - src/**/*.c
          - src/**/*.h
          - src/commands/**/*.json
          - tests/**/*.tcl
          - utils/**/*.py
          - runtest*
          # The two files that document every configuration option, with defaults and the
          # prose explaining each one. They were never included, so every configuration question
          # was answered from test files and topic docs by luck: "what does repl-diskless-sync
          # do?" retrieved four Tcl tests and never the option's own documentation.
          - /valkey.conf
          - /sentinel.conf
        reason: canonical_core_behavior_policy_source_and_tests
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  valkey_documentation:
    rules:
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /LICENSE*
          - "/*.md"
          - commands/**/*.md
          - topics/**/*.md
          - project-docs/**/*.md
          - modules/**/*.md
          - clients/**/*.md
          - libraries/**/*.md
          - resources/**/*.md
          - tools/**/*.md
          - /groups.json
          - /languages.json
        reason: canonical_user_and_contributor_documentation
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  documentation:
    rules:
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /LICENSE*
          - "/*.md"
          - commands/**/*.md
          - topics/**/*.md
          - src/content/docs/**/*.md
          - src/content/docs/**/*.mdx
          - project-docs/**/*.md
          - modules/**/*.md
          - clients/**/*.md
          - libraries/**/*.md
          - resources/**/*.md
          - tools/**/*.md
          - /groups.json
          - /languages.json
        reason: canonical_user_and_contributor_documentation
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  website:
    rules:
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /LICENSE*
          - content/**/*.md
          - content/**/*.html
          - config/**/*.yaml
          - config/**/*.toml
        reason: canonical_non_generated_website_content
      - action: exclude
        patterns: ["**"]
        reason: generated_or_non_content_website_material

  planet_policy:
    rules:
      - action: exclude
        patterns:
          - content/**
          - data/**
          - templates/**
          - public/**
        reason: aggregated_output_or_template
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /LICENSE*
          - docs/**/*.md
          - policies/**/*.md
          - "/*.md"
        reason: planet_contribution_aggregation_filtering_credit_and_history_policy
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  module:
    rules:
      - action: exclude
        patterns:
          - tests/__init__.py
        reason: empty_python_package_marker_is_not_evidence
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /SECURITY*
          - /LICENSE*
          - /CHANGELOG*
          - /RELEASE*
          - /00-RELEASENOTES
          - /versions.json
          - "/*.md"
          - docs/**/*.md
          - rfc/**/*.md
          - examples/**
          - packaging/**
          - src/**/*.c
          - src/**/*.h
          - src/**/*.rs
          - tests/**/*.tcl
          - tests/**/*.py
          - tests/**/*.rs
        reason: module_behavior_security_compatibility_examples_and_tests
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  client:
    rules:
      - action: exclude
        patterns:
          - tests/**/__init__.py
          - "**/generated/**"
          - "**/generated_commands/**"
          - "**/benchmark/**"
          - "**/benchmarks/**"
        reason: generated_or_benchmark_material
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /SECURITY*
          - /LICENSE*
          - /CHANGELOG*
          - /RELEASE*
          - /MIGRAT*
          - "/*.md"
          - docs/**/*.md
          - examples/**
          - src/**
          - include/**
          - tests/**
        reason: public_client_api_compatibility_examples_and_behavior_tests
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  deployment:
    rules:
      - action: exclude
        patterns:
          - "**/rendered/**"
          - "**/screenshots/**"
          - "**/images/**"
        reason: rendered_or_bulk_visual_output
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /SECURITY*
          - /LICENSE*
          - /CHANGELOG*
          - /versions.json
          - "/*.md"
          - docs/**/*.md
          - examples/**
          - "*/README.md"
          - "*/Chart.yaml"
          - "*/values.yaml"
          - "*/values.schema.json"
          - charts/**/README.md
          - charts/**/values.yaml
          - charts/**/values.schema.json
          - config/**
          - api/**
          - deploy/**
          - docs-site/src/content/docs/**/*.md
          - docs-site/src/content/docs/**/*.mdx
          - apps/metrics/config.yml
        reason: installation_configuration_operations_and_public_api_guidance
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  testing_automation:
    rules:
      - action: include
        patterns:
          - /README*
          - /CONTRIBUTING*
          - /SECURITY*
          - /LICENSE*
          - /CHANGELOG*
          - "/*.md"
          - docs/**/*.md
          - examples/**
          - config/**
          - configs/**
          - schemas/**
          - /action.yml
          - /repos.yml
          - /.github/workflows/build-release.yml
        reason: public_test_provenance_automation_interfaces_and_runbooks
      - action: exclude
        patterns: ["**"]
        reason: implementation_or_output_not_selected

  secondary:
    rules:
      - action: include
        patterns:
          - /README*
          - /LICENSE*
          - skills/**/*.md
        reason: reviewed_secondary_guidance
      - action: exclude
        patterns: ["**"]
        reason: not_selected

  structured_hashes:
    rules:
      - action: include
        patterns:
          - /README*
          - /LICENSE*
          - "*.json"
          - "*.txt"
          - "*.sha256"
          - "**/*.json"
          - "**/*.txt"
          - "**/*.sha256"
        reason: deterministic_release_artifact_digest_records
      - action: exclude
        patterns: ["**"]
        reason: not_a_supported_digest_record

  none:
    rules:
      - action: exclude
        patterns: ["**"]
        reason: no_static_corpus_material

